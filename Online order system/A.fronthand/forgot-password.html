<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Online Order System</title>
  <link rel="stylesheet" href="css/auth.css?v=30" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand-badge">HELP</div>
      <h2>Reset Your Password</h2>
      <p>Answer your security question and set a new password to recover your account.</p>
    </div>

    <div class="auth-card reveal-card">
      <div class="auth-card-top">
        <span class="auth-chip">Recovery</span>
        <h1>Forgot Password</h1>
        <p>Enter your email to load your security question.</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="input-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" name="email" placeholder="Enter your email" required />
        </div>

        <div id="answerSection" style="display:none;">
          <div class="input-group">
            <label>Security Question</label>
            <p id="questionBox"></p>
          </div>

          <div class="input-group">
            <label for="securityAnswer">Your Answer</label>
            <input type="text" id="securityAnswer" name="security_answer" placeholder="Enter your answer" />
          </div>

          <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="password" placeholder="Enter new password" />
          </div>
        </div>

        <button type="submit" id="sendResetBtn" class="primary-btn auth-submit-btn">Get Security Question</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
  <script src="js/ui-enhancements.js?v=3"></script>
</body>
</html>
