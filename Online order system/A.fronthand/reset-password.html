<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Online Order System</title>
  <link rel="stylesheet" href="css/auth.css?v=30" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand-badge">SAFE</div>
      <h2>Create a New Password</h2>
      <p>Choose a new password to secure your account and continue using the system.</p>
    </div>

    <div class="auth-card reveal-card">
      <div class="auth-card-top">
        <span class="auth-chip">Password Reset</span>
        <h1>Reset Password</h1>
        <p>Enter and confirm your new password below.</p>
      </div>

      <form id="resetPasswordForm" class="auth-form">
        <input type="hidden" name="token" id="token" />

        <div class="input-group">
          <label for="resetNewPassword">New Password</label>
          <input type="password" id="resetNewPassword" name="password" placeholder="Enter new password" required />
        </div>

        <div class="input-group">
          <label for="resetConfirmPassword">Confirm New Password</label>
          <input type="password" id="resetConfirmPassword" name="confirm_password" placeholder="Confirm new password" required />
        </div>

        <button type="submit" class="primary-btn auth-submit-btn">Reset Password</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/reset-password.js"></script>
  <script src="js/ui-enhancements.js?v=3"></script>
</body>
</html>
